services:
  vvv:
    build: .
    image: localhost/vvv:latest
    ports:
      # Host port is configurable; 8080 is the in-container port.
      - '${VVV_PORT:-8081}:8080'
    environment:
      # Demo default for quick local trials — set a strong unique value for real use.
      VVV_PASSWORD: ${VVV_PASSWORD:-vvv-demo}
    volumes:
      - vvv-data:/data
      # Set MEDIA_DIR to a directory reachable from the podman host/VM.
      # Default mount is read-only; set MEDIA_MOUNT_MODE=rw to allow quarantining
      # media into .vvv-trash/ (needed to test the full delete loop).
      - ${MEDIA_DIR:-./tests/fixtures/data/}:/media:${MEDIA_MOUNT_MODE:-ro}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
volumes:
  vvv-data:
